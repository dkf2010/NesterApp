name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package Release
        run: |
          mkdir release_package
          cp -r dist release_package/
          cp -r backend release_package/
          cp README.md LICENSE INSTALLATION.md CONTRIBUTING.md .env.example release_package/
          cd release_package
          zip -r ../NesterApp-Release-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: NesterApp-Release-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare production deployment package
        run: |
          mkdir prod_deploy_package
          cp -r dist/* prod_deploy_package/
          cp -r backend prod_deploy_package/
          cp .htaccess prod_deploy_package/
          rm -rf prod_deploy_package/backend/uploads
          rm -f prod_deploy_package/backend/create_admin.php

      - name: Deploy to Production FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PROD_FTP_HOST }}
          username: ${{ secrets.PROD_FTP_USER }}
          password: ${{ secrets.PROD_FTP_PASS }}
          local-dir: ./prod_deploy_package/
          server-dir: ./
          exclude: |
            **/backend/uploads/**
            **/backend/create_admin.php

