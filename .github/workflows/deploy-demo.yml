name: Deploy Demo Instance

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Frontend Dependencies & Build
        env:
          VITE_API_BASE_URL: "https://nester-demo.philip.ps/backend/api"
        run: |
          echo "Building with VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm ci
          npm run build
          echo "Verifying compiled output does not contain tabit:"
          grep -r "tabit" dist/ || echo "OK: no 'tabit' found in build output"
          # Move compiled frontend to root so rsync uploads it to the base path
          rsync -a dist/ ./

      - name: Deploy via rsync
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "/"
          TARGET: "/home/philippsnesterdemo/web/nester-demo/"
          REMOTE_HOST: ${{ secrets.DEMO_HOST }}
          REMOTE_USER: ${{ secrets.DEMO_USERNAME }}
          EXCLUDE: "/node_modules/, /.git/, /.github/, /src/, /public/, /vite.config.js, /package.json, /package-lock.json, /README.md, /eslint.config.js, /docs/, /CONTRIBUTING.md, /sync_www.command, /backend/uploads/, /backend/create_admin.php, /.DS_Store, /.env, /dist/, /INSTALLATION.md, /LICENSE, /.gitignore, /.env.example"

      - name: Redeploy Database & Set Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEMO_HOST }}
          username: ${{ secrets.DEMO_USERNAME }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            echo "=== User & Environment ==="
            whoami
            id
            pwd

            echo "=== Ensuring Correct Permissions ==="
            find /home/philippsnesterdemo/web/nester-demo/ -type d -exec chmod 755 {} \; 2>/dev/null || true
            find /home/philippsnesterdemo/web/nester-demo/ -type f -exec chmod 644 {} \; 2>/dev/null || true

            cd /home/philippsnesterdemo/web/nester-demo/backend
            
            # Since you wanted the database redeployed on every deployment, 
            # we run a PHP script to clean it, apply schema, and create users.
            cat << 'EOF' > deploy_reset.php
            <?php
            require 'api/db.php';
            try {
                $pdo->query('SET FOREIGN_KEY_CHECKS = 0');
                $tables = $pdo->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);
                foreach ($tables as $table) {
                    $pdo->query('DROP TABLE IF EXISTS `' . $table . '`');
                }
                
                $sql = file_get_contents('schema.sql');
                // Strip statements that might cause permission errors on shared hosting
                $sql = preg_replace('/\bCREATE\s+DATABASE\b[^;]+;/i', '', $sql);
                $sql = preg_replace('/\bUSE\b\s+[^;]+;/i', '', $sql);
                $pdo->exec($sql);
                
                $pdo->query('SET FOREIGN_KEY_CHECKS = 1');
                
                $demoHash = password_hash('demo123', PASSWORD_DEFAULT);
                
                $stmt = $pdo->prepare('INSERT INTO users (id, username, email, password_hash, is_admin) VALUES (?, ?, ?, ?, ?)');
                $stmt->execute([bin2hex(random_bytes(18)), 'demo', 'demo@example.com', $demoHash, 0]);
                
                echo "Database successfully cleaned, schema imported, and users created!\n";
            } catch (Exception $e) {
                echo "DB Error: " . $e->getMessage() . "\n";
                http_response_code(500);
                exit(1);
            }
            EOF

            echo "=== Attempting HTTP trigger ==="
            HTTP_SUCCESS=false
            if curl -sSf https://nester-demo.philip.ps/backend/deploy_reset.php; then
                HTTP_SUCCESS=true
            else
                echo "HTTP request returned error. Detailed response:"
                curl -iv https://nester-demo.philip.ps/backend/deploy_reset.php 2>&1 || true
            fi

            if [ "$HTTP_SUCCESS" = "false" ]; then
                echo "=== Attempting CLI fallback ==="
                CLI_SUCCESS=false
                if php deploy_reset.php; then
                    echo "CLI execution succeeded!"
                    CLI_SUCCESS=true
                else
                    echo "CLI execution failed."
                fi

                echo "=== Inspecting Server Logs for Diagnosing 403 ==="
                for logpath in \
                    "/home/philippsnesterdemo/log/error.log" \
                    "/home/philippsnesterdemo/web/nester-demo/../log/error.log" \
                    "/var/log/apache2/error.log" \
                    "/var/log/apache2/suexec.log" \
                    "/home/philippsnesterdemo/log/suexec.log"; do
                    if [ -f "$logpath" ]; then
                        echo "--- Last lines of $logpath ---"
                        tail -n 25 "$logpath" 2>/dev/null || true
                    fi
                done

                echo "=== Inspecting Apache vhost & htaccess configuration ==="
                cat /home/philippsnesterdemo/web/nester-demo/.htaccess 2>/dev/null || true
                find /home/philippsnesterdemo/web/nester-demo/ -name ".htaccess" -exec cat {} + 2>/dev/null || true
                grep -iE "filesmatch|require|handler|php" /etc/apache2/sites-available/*nester* 2>/dev/null || true

                if [ "$CLI_SUCCESS" = "false" ]; then
                    rm -f deploy_reset.php
                    exit 1
                fi
            fi
            
            # Clean up
            rm -f deploy_reset.php
